[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "osservare-a-strati"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "anthropic",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-http",
    "opentelemetry-instrumentation-logging",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "httpx2"]

[project.scripts]
strati = "osservare_a_strati.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.setuptools.packages.find]
include = ["osservare_a_strati*"]

# Solo `ruff check`, niente `ruff format`: il formatter spezza le righe marcate `# sN` su piu' righe, e cambierebbe
# il conteggio di `strati righe` e il codice che `strati codice N` estrae per le slide.
[tool.ruff]
line-length = 120

[tool.ruff.lint.per-file-ignores]
"osservare_a_strati/esecuzione.py" = ["BLE001"]
