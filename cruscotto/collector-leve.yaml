# Collector con le due leve dell'atto 4, sopra la configurazione della demo (cruscotto/collector.yaml).
# Le stesse trace entrano in due pipeline: una tiene le anomale con il testo, l'altra toglie il testo
# e ne lascia passare solo il 20%. Ogni trace arriva a Tempo una volta sola.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  batch: {}
  # pipeline 1: le anomale, tutte, con il testo
  tail_sampling/anomale:
    decision_wait: 10s
    policies:
      - name: chiamata-pesante
        type: numeric_attribute
        numeric_attribute:
          key: gen_ai.usage.input_tokens
          min_value: 10000
          max_value: 10000000
  # pipeline 2: tutte le altre, il 20%
  tail_sampling/altre:
    decision_wait: 10s
    policies:
      - name: non-anomale-al-20-per-cento
        type: and
        and:
          and_sub_policy:
            - name: non-pesante
              type: numeric_attribute
              numeric_attribute:
                key: gen_ai.usage.input_tokens
                min_value: 10000
                max_value: 10000000
                invert_match: true
            - name: venti-per-cento
              type: probabilistic
              probabilistic:
                sampling_percentage: 20
  # ...e per le altre il testo si cancella
  transform/togli_testo:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - delete_key(attributes, "gen_ai.input.messages")
          - delete_key(attributes, "gen_ai.output.messages")
          - delete_key(attributes, "gen_ai.system_instructions")
          - delete_key(attributes, "gen_ai.tool.call.result")
exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
  otlphttp/prometheus:
    endpoint: http://prometheus:9090/api/v1/otlp
service:
  pipelines:
    traces/anomale:
      receivers: [otlp]
      processors: [tail_sampling/anomale, batch]
      exporters: [otlp/tempo]
    traces/altre:
      receivers: [otlp]
      processors: [tail_sampling/altre, transform/togli_testo, batch]
      exporters: [otlp/tempo]
    logs:
      receivers: [otlp]
      exporters: [otlphttp/loki]
    metrics:
      receivers: [otlp]
      exporters: [otlphttp/prometheus]
