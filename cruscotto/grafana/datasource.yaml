apiVersion: 1
datasources:
  - name: Loki
    type: loki
    uid: loki
    url: http://loki:3100
    jsonData:
      # dalla riga di log alla sua trace: trace_id arriva come metadato strutturato, non nel testo
      derivedFields:
        - name: trace_id
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: tempo
          url: "$${__value.raw}"
          urlDisplayLabel: apri la trace
  - name: Tempo
    type: tempo
    uid: tempo
    url: http://tempo:3200
    isDefault: true
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        # i log arrivano con trace_id e span_id come metadati strutturati, non nel testo: serve una query propria.
        # Il doppio dollaro evita che il provisioning espanda la variabile come se fosse d'ambiente.
        customQuery: true
        query: '{service_name="osservare-a-strati"} | trace_id="$${__trace.traceId}"'
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
  - name: Prometheus
    type: prometheus
    uid: prometheus
    url: http://prometheus:9090
    jsonData:
      # dall'exemplar di una misura alla trace della richiesta che l'ha prodotta
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo
          urlDisplayLabel: apri la trace
